[project]
name = "chatty"
version = "0.2.1"
description = "Interactive CLI chat client for OpenAI-compatible endpoints"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "prompt-toolkit>=3.0",
    "rich>=13.0",
    "httpx>=0.27",
    "tiktoken>=0.7",
    "pyperclip>=1.11.0",
    "tomlkit>=0.12.0",
]

[project.optional-dependencies]
# Web UI extra: `pip install chatty[web]` / `uv tool install 'chatty[web]'`.
# websockets is not imported directly but uvicorn needs a WS implementation
# for FastAPI WebSocket support, so it is kept here rather than dropped.
web = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "websockets>=12.0",
]

[project.scripts]
chatty = "chatty.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatty"]
# Ship the web UI static assets (non-.py files) as package data.
artifacts = [
    "src/chatty/web/public/**",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
    "pytest-cov>=5.0.0",
    "respx>=0.23.1",
    "ruff>=0.15.14",
    # Web UI deps needed to exercise the server in tests.
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "websockets>=12.0",
    "pytest-timeout>=2.4.0",
]

[tool.ruff]
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]
line-length = 120
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# A safety net so a stuck WebSocket receive can never hang the whole suite.
timeout = 60
addopts = "--cov=chatty --cov-report=term-missing --cov-fail-under=55"

[tool.coverage.run]
source = ["chatty"]
omit = ["src/chatty/web/public/*"]

