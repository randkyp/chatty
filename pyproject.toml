[project]
name = "chatty"
version = "0.1.0"
description = "Interactive CLI chat client for OpenAI-compatible endpoints"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "prompt-toolkit>=3.0",
    "rich>=13.0",
    "httpx>=0.27",
    "tiktoken>=0.7",
]

[project.scripts]
chatty = "chatty.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatty"]
