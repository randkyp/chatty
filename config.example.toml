# Chatty – example configuration
# Copy to config.toml and edit to taste:  cp config.example.toml config.toml
#
# Each [profile.<name>] section defines a connection profile.
# Launch with:  chatty -p <name>

[profile.default]
base_url = "http://localhost:8080"
# api_key = "sk-..."
# api_key_mode = "ephemeral"  # Use instead of api_key; enter it with /apikey.
# model = "my-model"
# system_prompt = "You are a helpful assistant."
# ctx_size = 8192
# genmax = 0

# [profile.default.samplers]
# temperature = 0.7
# top_p = 0.9
# repeat_penalty = 1.1

# ── Example: OpenAI ────────────────────────────────────────────────────────

# [profile.openai]
# base_url = "https://api.openai.com"
# api_key_mode = "ephemeral"
# model = "gpt-4o"
# system_prompt = "You are a helpful assistant."
# ctx_size = 128000
# genmax = 4096
#
# [profile.openai.samplers]
# temperature = 0.7

# Ephemeral keys live only in the chatty CLI or web-server process. The Web UI
# shares the current key for a profile across connections and reconnects.

